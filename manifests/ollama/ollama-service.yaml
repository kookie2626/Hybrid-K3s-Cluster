# v2 example: replace MAC_MINI_LAN_IP with the Mac mini fixed IPv4.
# Remove the old v1 Endpoints before applying; see docs/v2/local-llm-integration.md.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: keun-federation
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ollama-mac-mini
  namespace: keun-federation
  labels:
    kubernetes.io/service-name: ollama
    endpointslice.kubernetes.io/managed-by: cluster-admins
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 11434
endpoints:
  - addresses:
      - "MAC_MINI_LAN_IP"
    conditions:
      ready: true
